 <!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Clientes — Estúdio de Tatuagem</title>
  <!-- Bootstrap: biblioteca de estilos prontos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
  /* ======================================================
ESTILO DA PÁGINA: CLIENTES
====================================================== */

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');

:root {
--bg-dark: #0f0f12;
--bg-card: #18181c;
--bg-input: #222227;
--border-color: #2e2e36;
--yellow-primary: #ffcc00;
--yellow-hover: #e6b800;
--yellow-glow: rgba(255, 204, 0, 0.25);
--text-main: #f0f0f3;
--text-muted: #a0a0ab;
}

body {
background-color: var(--bg-dark) !important;
color: var(--text-main) !important;
font-family: 'Plus Jakarta Sans', sans-serif;
min-height: 100vh;
}

h1 {
font-family: 'Cinzel', serif;
font-size: 2.2rem;
font-weight: 700;
color: var(--yellow-primary);
text-transform: uppercase;
border-bottom: 2px solid var(--border-color);
padding-bottom: 12px;
margin-top: 10px;
}

.navbar {
background-color: var(--bg-card) !important;
border-bottom: 1px solid var(--border-color);
border-radius: 12px;
padding: 0.8rem 1.5rem !important;
box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

.navbar-brand {
font-family: 'Cinzel', serif;
color: var(--yellow-primary) !important;
font-weight: 700;
}

.navbar a.text-light {
color: var(--text-muted) !important;
text-decoration: none;
font-weight: 500;
transition: all 0.3s ease;
}

.navbar a.text-light:hover {
color: var(--yellow-primary) !important;
}

#form-cliente {
background-color: var(--bg-card);
padding: 1.25rem;
border-radius: 12px;
border: 1px solid var(--border-color);
}

.form-control {
background-color: var(--bg-input) !important;
border: 1px solid var(--border-color) !important;
color: var(--text-main) !important;
border-radius: 8px;
}

.form-control:focus {
border-color: var(--yellow-primary) !important;
box-shadow: 0 0 0 0.25rem var(--yellow-glow) !important;
}

.btn-primary {
background-color: var(--yellow-primary) !important;
border-color: var(--yellow-primary) !important;
color: #000000 !important;
font-weight: 700;
border-radius: 8px;
}

.btn-primary:hover {
background-color: var(--yellow-hover) !important;
box-shadow: 0 0 15px var(--yellow-glow) !important;
}

.table {
color: var(--text-main) !important;
border-color: var(--border-color) !important;
margin-top: 20px;
background-color: var(--bg-card);
border-radius: 12px;
overflow: hidden;
}

.table thead {
background-color: #1f1f26;
}

.table th {
color: var(--yellow-primary);
font-weight: 600;
border-bottom: 2px solid var(--border-color) !important;
}

.table td {
background-color: var(--bg-card) !important;
color: var(--text-main) !important;
border-color: var(--border-color) !important;
}
</style>
<body class="container py-4">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">Estúdio de Tatuagem</span>
    <div>
      <a href="clientes.html" class="text-light me-3">Clientes</a>
      <a href="senioridade.html" class="text-light me-3">Senioridade</a>
      <a href="estilos.html" class="text-light me-3">Estilos</a>
      <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
      <a href="agendamentos.html" class="text-light me-3">Agendamentos</a>
      <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </div>
</nav>
  <h1>Clientes</h1>

  <!-- Formulário para cadastrar novo cliente -->
  <form id="form-cliente" class="row g-2 mt-2 mb-4">
    <div class="col-md-3">
      <input type="text" id="nome" class="form-control" placeholder="Nome" required>
    </div>
    <div class="col-md-2">
      <input type="text" id="cpf" class="form-control" placeholder="CPF (só números)" required>
    </div>
    <div class="col-md-2">
      <input type="text" id="telefone" class="form-control" placeholder="Telefone">
    </div>
    <div class="col-md-2">
      <input type="text" id="cidade" class="form-control" placeholder="Cidade">
    </div>
    <div class="col-md-1">
      <input type="text" id="uf" class="form-control" placeholder="UF" maxlength="2">
    </div>
    <div class="col-md-2">
      <button id="btn-submit-cliente" type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </div>
  </form>

  <!-- Tabela onde os clientes vão aparecer -->
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>Telefone</th>
        <th>Cidade</th>
        <th>UF</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
      <!-- os clientes vão aparecer aqui -->
    </tbody>
  </table>

  <!-- Importa o arquivo JavaScript separado -->
  <script src="js/clientes.js"></script>

</body>
</html>
