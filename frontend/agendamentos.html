<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Agendamentos — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
  /* ======================================================
ESTILO DA PÁGINA: AGENDAMENTOS
====================================================== */

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');

:root {
--bg-dark: #0f0f12;
--bg-card: #18181c;
--bg-input: #222227;
--border-color: #2e2e36;
--yellow-primary: #ffcc00;
--yellow-hover: #e6b800;
--yellow-glow: rgba(255, 204, 0, 0.25);
--text-main: #f0f0f3;
--text-muted: #a0a0ab;
}

body {
background-color: var(--bg-dark) !important;
color: var(--text-main) !important;
font-family: 'Plus Jakarta Sans', sans-serif;
min-height: 100vh;
}

h1 {
font-family: 'Cinzel', serif;
font-size: 2.2rem;
font-weight: 700;
color: var(--yellow-primary);
text-transform: uppercase;
border-bottom: 2px solid var(--border-color);
padding-bottom: 12px;
margin-top: 10px;
}

/* Navbar */
.navbar {
background-color: var(--bg-card) !important;
border-bottom: 1px solid var(--border-color);
border-radius: 12px;
padding: 0.8rem 1.5rem !important;
box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

.navbar-brand {
font-family: 'Cinzel', serif;
color: var(--yellow-primary) !important;
font-weight: 700;
font-size: 1.3rem;
}

.navbar a.text-light {
color: var(--text-muted) !important;
text-decoration: none;
font-weight: 500;
transition: all 0.3s ease;
}

.navbar a.text-light:hover {
color: var(--yellow-primary) !important;
text-shadow: 0 0 8px var(--yellow-glow);
}

/* Form Container */
#form-agendamento {
background-color: var(--bg-card);
padding: 1.5rem;
border-radius: 12px;
border: 1px solid var(--border-color);
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

.form-control, .form-select {
background-color: var(--bg-input) !important;
border: 1px solid var(--border-color) !important;
color: var(--text-main) !important;
border-radius: 8px;
padding: 0.6rem 0.9rem;
transition: all 0.3s ease;
}

.form-control::placeholder {
color: var(--text-muted) !important;
opacity: 0.7;
}

.form-control:focus, .form-select:focus {
background-color: #27272e !important;
border-color: var(--yellow-primary) !important;
box-shadow: 0 0 0 0.25rem var(--yellow-glow) !important;
color: #ffffff !important;
}

.form-label {
color: var(--text-muted);
font-size: 0.85rem;
margin-bottom: 4px;
}

/* Botão Principais */
.btn-primary {
background-color: var(--yellow-primary) !important;
border-color: var(--yellow-primary) !important;
color: #000000 !important;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.5px;
border-radius: 8px;
padding: 0.6rem;
transition: all 0.3s ease !important;
}

.btn-primary:hover {
background-color: var(--yellow-hover) !important;
border-color: var(--yellow-hover) !important;
box-shadow: 0 0 15px var(--yellow-glow) !important;
}

.btn-outline-light:hover {
background-color: #dc3545 !important;
border-color: #dc3545 !important;
}

/* Tabela de Agendamentos */
.table {
color: var(--text-main) !important;
border-color: var(--border-color) !important;
margin-top: 20px;
background-color: var(--bg-card);
border-radius: 12px;
overflow: hidden;
box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.table thead {
background-color: #1f1f26;
}

.table th {
color: var(--yellow-primary);
font-weight: 600;
text-transform: uppercase;
font-size: 0.85rem;
letter-spacing: 0.5px;
border-bottom: 2px solid var(--border-color) !important;
padding: 1rem !important;
}

.table td {
padding: 0.9rem !important;
vertical-align: middle;
background-color: var(--bg-card) !important;
color: var(--text-main) !important;
border-color: var(--border-color) !important;
}

.table tbody tr:hover td {
background-color: #212128 !important;
}
</style>

<body class="container py-4">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">Estúdio de Tatuagem</span>
    <div>
      <a href="clientes.html" class="text-light me-3">Clientes</a>
      <a href="senioridade.html" class="text-light me-3">Senioridade</a>
      <a href="estilos.html" class="text-light me-3">Estilos</a>
      <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
      <a href="agendamentos.html" class="text-light me-3">Agendamentos</a>
      <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </div>
</nav>

  <h1>Agendamentos</h1>

  <!-- Formulário para cadastrar novo agendamento -->
  <form id="form-agendamento" class="row g-2 mt-2 mb-4">
    <div class="col-md-3">
      <select id="idcliente" class="form-select" required>
        <option value="">Cliente...</option>
      </select>
    </div>
    <div class="col-md-3">
      <select id="idtatuador" class="form-select" required>
        <option value="">Tatuador...</option>
      </select>
    </div>
    <div class="col-md-2">
      <input type="date" id="dataagendamento" class="form-control" required>
    </div>
    <div class="col-md-2">
      <input type="time" id="horaagendamento" class="form-control" required>
    </div>
    <div class="col-md-2">
      <input type="number" id="valortatuagem" class="form-control" placeholder="Valor (R$)" step="0.01" min="0">
    </div>    <div class="col-md-4">
      <label class="form-label">Desenho aprovado (imagem)</label>
      <input type="file" id="desenho" class="form-control" accept="image/*">
    </div>
    <div class="col-md-12">
      <textarea id="descricaotatuagem" class="form-control" placeholder="Descrição da tatuagem"></textarea>
    </div>

    <!-- Esse bloco começa escondido — só aparece quando estamos editando um agendamento existente -->
    <div class="col-md-3" id="bloco-status" style="display: none;">
      <select id="status" class="form-select">
        <option value="pendente">Pendente</option>
        <option value="confirmado">Confirmado</option>
        <option value="concluido">Concluído</option>
        <option value="cancelado">Cancelado</option>
      </select>
    </div>

    <div class="col-md-2">
      <button id="btn-submit-agendamento" type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </div>
  </form>

  <!-- Tabela onde os agendamentos vão aparecer -->
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Tatuador</th>
        <th>Data</th>
        <th>Hora</th>
        <th>Valor</th>
        <th>Status</th>
        <th>Desenho</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
      <!-- os agendamentos vão aparecer aqui -->
    </tbody>
  </table>

  <script src="js/auth.js"></script>
  <script src="js/agendamentos.js"></script>

</body>

</html>
