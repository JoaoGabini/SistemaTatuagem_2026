<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Estilos — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<style>
  /* ======================================================
ESTILO DA PÁGINA: ESTILOS DE TATUAGEM
====================================================== */

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');

:root {
--bg-dark: #0f0f12;
--bg-card: #18181c;
--bg-input: #222227;
--border-color: #2e2e36;
--yellow-primary: #ffcc00;
--yellow-hover: #e6b800;
--yellow-glow: rgba(255, 204, 0, 0.25);
--text-main: #f0f0f3;
--text-muted: #a0a0ab;
}

body {
background-color: var(--bg-dark) !important;
color: var(--text-main) !important;
font-family: 'Plus Jakarta Sans', sans-serif;
min-height: 100vh;
}

h1 {
font-family: 'Cinzel', serif;
font-size: 2.2rem;
font-weight: 700;
color: var(--yellow-primary);
text-transform: uppercase;
border-bottom: 2px solid var(--border-color);
padding-bottom: 12px;
}

.navbar {
background-color: var(--bg-card) !important;
border-bottom: 1px solid var(--border-color);
border-radius: 12px;
padding: 0.8rem 1.5rem !important;
}

.navbar-brand {
font-family: 'Cinzel', serif;
color: var(--yellow-primary) !important;
font-weight: 700;
}

.navbar a.text-light {
color: var(--text-muted) !important;
text-decoration: none;
}

.navbar a.text-light:hover {
color: var(--yellow-primary) !important;
}

#form-estilo {
background-color: var(--bg-card);
padding: 1.25rem;
border-radius: 12px;
border: 1px solid var(--border-color);
}

.form-control {
background-color: var(--bg-input) !important;
border: 1px solid var(--border-color) !important;
color: var(--text-main) !important;
border-radius: 8px;
}

.form-control::placeholder {
color: #ffffff !important;
opacity: 1;
}

.form-control:focus {
border-color: var(--yellow-primary) !important;
box-shadow: 0 0 0 0.25rem var(--yellow-glow) !important;
}

.btn-primary {
background-color: var(--yellow-primary) !important;
border-color: var(--yellow-primary) !important;
color: #000000 !important;
font-weight: 700;
border-radius: 8px;
}

.btn-primary:hover {
background-color: var(--yellow-hover) !important;
box-shadow: 0 0 15px var(--yellow-glow) !important;
}

.table {
color: var(--text-main) !important;
border-color: var(--border-color) !important;
margin-top: 20px;
background-color: var(--bg-card);
border-radius: 12px;
overflow: hidden;
}

.table thead {
background-color: #1f1f26;
}

.table th {
color: var(--yellow-primary);
font-weight: 600;
}

.table td {
background-color: var(--bg-card) !important;
color: var(--text-main) !important;
border-color: var(--border-color) !important;
}
</style>
<body class="container py-4">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Estúdio de Tatuagem</span>
      <div>
        <a href="clientes.html" class="text-light me-3">Clientes</a>
        <a href="senioridade.html" class="text-light me-3">Senioridade</a>
        <a href="estilos.html" class="text-light me-3">Estilos</a>
        <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
        <a href="agendamentos.html" class="text-light">Agendamentos</a>
      </div>
    </div>
  </nav>

  <h1>Estilos</h1>

  <form id="form-estilo" class="row g-2 mt-2 mb-4">
    <div class="col-md-4">
      <input type="text" id="descricao" class="form-control" placeholder="Descrição (ex: Blackwork)" required>
    </div>
    <div class="col-md-2">
      <button id="btn-submit-estilo" type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </div>
  </form>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Descrição</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
    </tbody>
  </table>

  <script src="js/auth.js"></script>
  <script src="js/estilos.js"></script>

</body>
</html>
