<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Tatuadores — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
  /* ======================================================
ESTILO DA PÁGINA: TATUADORES
====================================================== */

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');

:root {
--bg-dark: #0f0f12;
--bg-card: #18181c;
--bg-input: #222227;
--border-color: #2e2e36;
--yellow-primary: #ffcc00;
--yellow-hover: #e6b800;
--yellow-glow: rgba(255, 204, 0, 0.25);
--text-main: #f0f0f3;
--text-muted: #a0a0ab;
}

body {
background-color: var(--bg-dark) !important;
color: var(--text-main) !important;
font-family: 'Plus Jakarta Sans', sans-serif;
min-height: 100vh;
}

h1 {
font-family: 'Cinzel', serif;
font-size: 2.2rem;
font-weight: 700;
color: var(--yellow-primary);
text-transform: uppercase;
border-bottom: 2px solid var(--border-color);
padding-bottom: 12px;
}

.navbar {
background-color: var(--bg-card) !important;
border-bottom: 1px solid var(--border-color);
border-radius: 12px;
padding: 0.8rem 1.5rem !important;
}

.navbar-brand {
font-family: 'Cinzel', serif;
color: var(--yellow-primary) !important;
font-weight: 700;
}

.navbar a.text-light {
color: var(--text-muted) !important;
text-decoration: none;
}

.navbar a.text-light:hover {
color: var(--yellow-primary) !important;
}

#form-tatuador {
background-color: var(--bg-card);
padding: 1.5rem;
border-radius: 12px;
border: 1px solid var(--border-color);
}

.form-control, .form-select {
background-color: var(--bg-input) !important;
border: 1px solid var(--border-color) !important;
color: var(--text-main) !important;
border-radius: 8px;
}

.form-control:focus, .form-select:focus {
border-color: var(--yellow-primary) !important;
box-shadow: 0 0 0 0.25rem var(--yellow-glow) !important;
}

.form-label {
color: var(--yellow-primary);
font-weight: 600;
font-size: 0.9rem;
margin-top: 10px;
}

/* Checkbox Lista de Estilos */
#lista-estilos {
background-color: var(--bg-input);
padding: 1rem;
border-radius: 8px;
border: 1px solid var(--border-color);
}

#lista-estilos .form-check-input {
background-color: var(--bg-dark);
border-color: var(--border-color);
}

#lista-estilos .form-check-input:checked {
background-color: var(--yellow-primary);
border-color: var(--yellow-primary);
}

#lista-estilos .form-check-label {
color: var(--text-main);
cursor: pointer;
}

.btn-primary {
background-color: var(--yellow-primary) !important;
border-color: var(--yellow-primary) !important;
color: #000000 !important;
font-weight: 700;
border-radius: 8px;
}

.btn-primary:hover {
background-color: var(--yellow-hover) !important;
box-shadow: 0 0 15px var(--yellow-glow) !important;
}

.table {
color: var(--text-main) !important;
border-color: var(--border-color) !important;
margin-top: 20px;
background-color: var(--bg-card);
border-radius: 12px;
overflow: hidden;
}

.table thead {
background-color: #1f1f26;
}

.table th {
color: var(--yellow-primary);
font-weight: 600;
}

.table td {
background-color: var(--bg-card) !important;
color: var(--text-main) !important;
border-color: var(--border-color) !important;
}
</style>

<body class="container py-4">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">Estúdio de Tatuagem</span>
    <div>
      <a href="clientes.html" class="text-light me-3">Clientes</a>
      <a href="senioridade.html" class="text-light me-3">Senioridade</a>
      <a href="estilos.html" class="text-light me-3">Estilos</a>
      <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
      <a href="agendamentos.html" class="text-light me-3">Agendamentos</a>
      <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </div>
</nav>

  <h1>Tatuadores</h1>

  <!-- Formulário para cadastrar novo tatuador -->
  <form id="form-tatuador" class="row g-2 mt-2 mb-4">
    <div class="col-md-3">
      <input type="text" id="nometatuador" class="form-control" placeholder="Nome" required>
    </div>
    <div class="col-md-2">
      <input type="text" id="cpf" class="form-control" placeholder="CPF (só números)" required>
    </div>
    <div class="col-md-3">
      <input type="email" id="email" class="form-control" placeholder="E-mail">
    </div>
    <div class="col-md-2">
      <input type="text" id="telefone" class="form-control" placeholder="Telefone">
    </div>
    <div class="col-md-2">
      <select id="idsenioridade" class="form-select" required>
        <option value="">Senioridade...</option>
        <!-- as opções são preenchidas pelo JavaScript -->
      </select>
    </div>
    <div class="col-md-12">
      <label class="form-label">Estilos que domina</label>
      <div id="lista-estilos" class="d-flex flex-wrap gap-3">
        <!-- os checkboxes são preenchidos pelo JavaScript -->
      </div>
    </div>
    <div class="col-md-2">
      <button id="btn-submit-tatuador" type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </div>
  </form>

  <!-- Tabela onde os tatuadores vão aparecer -->
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Senioridade</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
      <!-- os tatuadores vão aparecer aqui -->
    </tbody>
  </table>

  <script src="js/tatuadores.js"></script>

</body>

</html>
