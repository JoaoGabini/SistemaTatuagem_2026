<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
  /* ======================================================
ESTILO DA PÁGINA: CADASTRO
====================================================== */

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');

:root {
--bg-dark: #0f0f12;
--bg-card: #18181c;
--bg-input: #222227;
--border-color: #2e2e36;
--yellow-primary: #ffcc00;
--yellow-hover: #e6b800;
--yellow-glow: rgba(255, 204, 0, 0.25);
--text-main: #f0f0f3;
--text-muted: #a0a0ab;
}

body {
background: radial-gradient(circle at center, #1a1a22 0%, var(--bg-dark) 100%) !important;
color: var(--text-main) !important;
font-family: 'Plus Jakarta Sans', sans-serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
}

body.container {
background-color: var(--bg-card) !important;
border: 1px solid var(--border-color);
border-radius: 16px;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
padding: 2.5rem !important;
}

h1 {
font-family: 'Cinzel', serif;
color: var(--yellow-primary);
text-align: center;
font-weight: 700;
text-transform: uppercase;
margin-bottom: 2rem !important;
}

.form-control {
background-color: var(--bg-input) !important;
border: 1px solid var(--border-color) !important;
color: var(--text-main) !important;
border-radius: 8px;
padding: 0.75rem 1rem;
}

.form-control:focus {
border-color: var(--yellow-primary) !important;
box-shadow: 0 0 0 0.25rem var(--yellow-glow) !important;
}

.btn-primary {
background-color: var(--yellow-primary) !important;
border-color: var(--yellow-primary) !important;
color: #000000 !important;
font-weight: 700;
text-transform: uppercase;
padding: 0.75rem;
border-radius: 8px;
margin-top: 0.5rem;
transition: all 0.3s ease !important;
}

.btn-primary:hover {
background-color: var(--yellow-hover) !important;
box-shadow: 0 0 20px var(--yellow-glow) !important;
}

a {
color: var(--yellow-primary);
text-decoration: none;
font-weight: 600;
}

a:hover {
color: var(--yellow-hover);
text-decoration: underline;
}
</style>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">Estúdio de Tatuagem</span>
      <div>
        <a href="login.html" class="btn btn-light">Entrar</a>
      </div>
    </div>
  </nav>

  <div class="container py-5 text-center">
    <h1 class="display-4">Seu estúdio, organizado do seu jeito</h1>
    <p class="lead">
      Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod
      tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim
      veniam, quis nostrud exercitation ullamco laboris.
    </p>
    <a href="cadastro.html" class="btn btn-primary btn-lg mt-3">Comece agora</a>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>
</body>

</html>
