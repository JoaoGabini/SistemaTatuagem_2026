<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
  /* ======================================================
ESTILO DA PÁGINA INICIAL / LANDING PAGE (index.html)
====================================================== */

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');

:root {
--bg-dark: #0f0f12;
--bg-card: #18181c;
--border-color: #2e2e36;
--yellow-primary: #ffcc00;
--yellow-hover: #e6b800;
--yellow-glow: rgba(255, 204, 0, 0.3);
--text-main: #f0f0f3;
--text-muted: #a0a0ab;
}

body {
background: radial-gradient(circle at top, #1c1c24 0%, var(--bg-dark) 70%) !important;
color: var(--text-main) !important;
font-family: 'Plus Jakarta Sans', sans-serif;
min-height: 100vh;
}

.navbar {
background-color: rgba(24, 24, 28, 0.8) !important;
backdrop-filter: blur(10px);
border-bottom: 1px solid var(--border-color);
padding: 1rem 0 !important;
}

.navbar-brand {
font-family: 'Cinzel', serif;
color: var(--yellow-primary) !important;
font-weight: 700;
font-size: 1.5rem;
letter-spacing: 1px;
}

.btn-light {
background-color: transparent !important;
border: 1px solid var(--yellow-primary) !important;
color: var(--yellow-primary) !important;
font-weight: 600;
border-radius: 8px;
padding: 0.4rem 1.2rem;
transition: all 0.3s ease !important;
}

.btn-light:hover {
background-color: var(--yellow-primary) !important;
color: #000000 !important;
box-shadow: 0 0 15px var(--yellow-glow);
}

/* Central Hero Section */
.container.py-5.text-center {
max-width: 800px;
margin-top: 5rem;
background-color: rgba(24, 24, 28, 0.6);
padding: 4rem 2rem !important;
border-radius: 20px;
border: 1px solid var(--border-color);
box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
}

h1.display-4 {
font-family: 'Cinzel', serif;
font-weight: 900;
color: #ffffff;
text-transform: uppercase;
margin-bottom: 1.5rem;
}

p.lead {
color: var(--text-muted);
font-size: 1.15rem;
line-height: 1.8;
margin-bottom: 2rem;
}

.btn-primary.btn-lg {
background-color: var(--yellow-primary) !important;
border-color: var(--yellow-primary) !important;
color: #000000 !important;
font-weight: 700;
font-size: 1.1rem;
text-transform: uppercase;
padding: 0.8rem 2.5rem;
border-radius: 50px;
transition: all 0.3s ease !important;
}

.btn-primary.btn-lg:hover {
background-color: var(--yellow-hover) !important;
transform: translateY(-3px);
box-shadow: 0 10px 25px var(--yellow-glow) !important;
}
</style>
<body class="container py-5" style="max-width: 480px;">

  <h1 class="mb-4">Criar conta</h1>

  <form id="form-cadastro">
    <div class="mb-3">
      <input type="text" id="nome" class="form-control" placeholder="Nome" required>
    </div>
    <div class="mb-3">
      <input type="email" id="email" class="form-control" placeholder="E-mail" required>
    </div>
    <div class="mb-3">
      <input type="password" id="senha" class="form-control" placeholder="Senha" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
  </form>

  <p class="mt-3 text-center">
    Já tem conta? <a href="login.html">Entrar</a>
  </p>

  <script src="js/cadastro.js"></script>

</body>
</html>
